<article class="sticky-story">
  <div>
    <p class="editorial-kicker">From the archives</p>
    <h2>{{ post.title | escape }}</h2>
    <p class="excerpt">{{ post.excerpt | strip_html | normalize_whitespace | truncate: 136 | escape }}</p>
    <a href="{{ post.url | relative_url }}" class="editorial-button">Read the story</a>
  </div>
  {% include story-media.html src=post.image section=post.categories.first variant='lead' %}
</article>
