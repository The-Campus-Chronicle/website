<article class="top-story">
  <a href="{{ post.url | relative_url }}" tabindex="-1" aria-hidden="true">
    {% include story-media.html src=post.image section=post.categories.first variant='thumb' %}
  </a>
  <div>
    <p class="story-meta">{% include story-category.html name=post.categories.first %} · <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%b %d, %Y' }}</time></p>
    <h2><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h2>
    <p class="story-meta">By {% include author-byline.html post=post %}</p>
  </div>
</article>
