<div class="col-md-6">
<div class="card border-0 mb-4 box-shadow">
<a href="{{site.baseurl}}{{latest_post.url}}">
<div class="topfirstimage" style="{% if latest_post.image %}background-image: url(&quot;{% if latest_post.image contains "://" %}{{ latest_post.image | escape }}{% else %}{{ latest_post.image | relative_url | escape }}{% endif %}&quot;);{% else %}background-color:#e8edf2;{% endif %} height: 200px; background-size: cover; background-position: center;"></div>
</a>
<div class="card-body px-0 pb-0 d-flex flex-column align-items-start">
<h2 class="h4 font-weight-bold">
<a class="text-dark" href="{{site.baseurl}}{{latest_post.url}}">{{ latest_post.title }}</a>
</h2>
<p class="excerpt">
    {{ latest_post.excerpt | strip_html | strip_newlines | truncate: 136 }}
</p>
<div>
    <small class="d-block text-muted">
        By {% include author-byline.html post=latest_post %}

        In <span class="catlist">
            {% for category in latest_post.categories %}
            <a class="text-capitalize smoothscroll" href="{% include category-url.html category=category %}">{{ category }}</a><span class="sep">, </span>
            {% endfor %}
            </span>
    </small>
    <small class="text-muted">
        {{ latest_post.date | date: '%b %d, %Y' }}
    </small>
</div>
</div>
</div>
</div>
