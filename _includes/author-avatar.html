{%- assign role = include.person.role | default: 'Member' | slugify -%}
{%- assign avatar = include.person.avatar | default: '' | strip -%}
<span class="role-avatar role-avatar--{{ role }}{% if include.size %} role-avatar--{{ include.size }}{% endif %}" aria-hidden="true">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" focusable="false">
  {% case role %}
    {% when 'editor-in-chief' %}<path d="m3 7 4.5 3 4.5-5 4.5 5L21 7l-2 10H5L3 7ZM6 20h12"/>
    {% when 'content-editor' %}<path d="M5 3h11l3 3v15H5zM8 9h8m-8 4h8m-8 4h5"/>
    {% when 'layout-editor' %}<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18m-11 0v11"/>
    {% when 'student-voices-editor' %}<path d="M4 5h16v11H9l-5 4zM8 10h8m-8 3h5"/>
    {% when 'public-relations-editor' %}<path d="m4 10 14-5v13L4 14zM7 15l2 5m12-11 1-1m-1 6 1 1"/>
    {% when 'former-editor-in-chief' %}<path d="m12 3 2.5 5 5.5.8-4 4 1 5.7-5-2.7-5 2.7 1-5.7-4-4 5.5-.8zM8 22h8"/>
    {% when 'former-editor' %}<path d="M5 4h11l3 3v13H5zM8 9h6m-6 4h8m-8 4h5"/>
    {% when 'former-member' %}<path d="m2 9 10-5 10 5-10 5zM6 11v6c3 3 9 3 12 0v-6m4-2v6"/>
    {% else %}<path d="M4 20l3.5-.7L20 6.8 17.2 4 4.7 16.5 4 20Zm11-14 3 3M4 20h16"/>
  {% endcase %}
  </svg>
  {% if avatar != '' %}
  {% unless avatar contains 'anonymous.jpg' %}
    <img src="{% if avatar contains '://' %}{{ avatar | escape }}{% else %}{{ avatar | relative_url | escape }}{% endif %}" alt="" width="96" height="96" loading="lazy" decoding="async" data-cover-image>
  {% endunless %}
  {% endif %}
</span>
